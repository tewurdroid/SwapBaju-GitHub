name: Extract uploaded project

on:
  push:
    branches: [main]
    paths:
      - "SwapBaju-GitHub-GitHub-Upload.zip"
      - ".github/workflows/extract-upload.yml"

permissions:
  contents: write

jobs:
  extract:
    if: "!contains(github.event.head_commit.message, '[skip extract]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf /tmp/swapbaju
          mkdir -p /tmp/swapbaju
          curl -L --fail --retry 3 -o /tmp/swapbaju.zip "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/SwapBaju-GitHub-GitHub-Upload.zip"
          unzip -o /tmp/swapbaju.zip -d /tmp/swapbaju
          cp -a /tmp/swapbaju/. .
          rm -rf /tmp/swapbaju /tmp/swapbaju.zip
          rm -f SwapBaju-GitHub-GitHub-Upload.zip
          rm -f UPLOAD_METHOD.md
          rm -f .github/workflows/extract-upload.yml

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete SwapBaju project [skip extract]" || exit 0
          git push
